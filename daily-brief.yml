name: Daily Portfolio Brief

on:
  schedule:
    # 6:30 AM CST = 11:30 UTC (during CDT/summer, daylight time)
    # CST is UTC-6, CDT is UTC-5. Cron uses UTC.
    # Running at 11:30 UTC = 6:30 AM CDT (summer) / 5:30 AM CST (winter)
    # If you want exact 6:30 AM regardless of season, use 12:30 UTC instead.
    - cron: '42 12 * * *'
  workflow_dispatch:  # allows manual trigger from GitHub UI for testing

jobs:
  send-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_brief.py
